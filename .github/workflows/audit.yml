name: Security Audit

# 依存関係の既知の脆弱性を検査する
# - 毎週の定期実行で、コード変更がなくても新たに公開されたアドバイザリを検知する
# - lockfileを変更するPRでも実行し、脆弱なバージョンの混入を防ぐ
# - このファイルを変更するPRでも実行し、受容済みの一覧（--ignore）の変更を確かめる
# 受容済みのアドバイザリは docs/design/non-functional.md を参照

on:
  schedule:
    # 毎週月曜 9:00 JST
    - cron: '0 0 * * 1'
  pull_request:
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'src-tauri/Cargo.toml'
      - 'src-tauri/Cargo.lock'
      - '.github/workflows/audit.yml'
      - 'scripts/npm-audit.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  npm:
    name: npm audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: '.node-version'

      # moderate以上で失敗させる。受容済みのアドバイザリ（docs/design/non-functional.md の一覧）は、
      # スクリプトの一覧で除く（npm auditには、指定して除く仕組みがない）。一覧を変えたら、ここも合わせる
      - name: Audit npm dependencies
        run: node scripts/npm-audit.mjs

  cargo:
    name: cargo audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install cargo-audit
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-audit

      # 脆弱性に加えて、警告（unmaintained・unsound・yanked）でも失敗させる（--deny warnings）。
      # 警告のままだとジョブが成功し、ログを読まないと気づけないため（ADR-124）
      # rust-toolchain.tomlによるツールチェーン導入を避けるため、cargo経由ではなく直接実行する
      # 受容済みのアドバイザリ（docs/design/non-functional.md の一覧）は --ignore で除く。
      # 一覧を変えたら、ここも合わせる。yankedの版はIDがなく除けないため、Cargo.lockを上げて直す
      - name: Audit Rust dependencies
        run: >-
          cargo-audit audit --file src-tauri/Cargo.lock
          --deny warnings
          --ignore RUSTSEC-2024-0429
          --ignore RUSTSEC-2024-0370
          --ignore RUSTSEC-2024-0436
          --ignore RUSTSEC-2026-0370
          --ignore RUSTSEC-2026-0371
          --ignore RUSTSEC-2026-0372
          --ignore RUSTSEC-2026-0543
