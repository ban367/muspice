name: Security Audit

# 依存関係の既知の脆弱性を検査する
# - 毎週の定期実行で、コード変更がなくても新たに公開されたアドバイザリを検知する
# - lockfileを変更するPRでも実行し、脆弱なバージョンの混入を防ぐ
# - このファイルを変更するPRでも実行し、受容済みの一覧（--ignore）の変更を確かめる
# 受容済みのアドバイザリは docs/design/non-functional.md を参照

on:
  schedule:
    # 毎週月曜 9:00 JST
    - cron: '0 0 * * 1'
  pull_request:
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'src-tauri/Cargo.toml'
      - 'src-tauri/Cargo.lock'
      - '.github/workflows/audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  npm:
    name: npm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: '.node-version'

      # moderate以上で失敗させる
      - name: Audit npm dependencies
        run: npm audit --audit-level=moderate

  cargo:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install cargo-audit
        uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-audit

      # 脆弱性で失敗させる（unmaintained・unsoundは警告として表示のみ）
      # rust-toolchain.tomlによるツールチェーン導入を避けるため、cargo経由ではなく直接実行する
      # 受容済みのアドバイザリ（docs/design/non-functional.md の一覧）は --ignore で除く。
      # 一覧を変えたら、ここも合わせる
      - name: Audit Rust dependencies
        run: >-
          cargo-audit audit --file src-tauri/Cargo.lock
          --ignore RUSTSEC-2024-0429
          --ignore RUSTSEC-2024-0370
          --ignore RUSTSEC-2024-0436
          --ignore RUSTSEC-2026-0370
          --ignore RUSTSEC-2026-0371
          --ignore RUSTSEC-2026-0372
