name: CI

# PRとmainへのpushで走らせる（ADR-125）。作業中のブランチへのpushでは走らせない（PRを開くと
# 同じコミットに対してpushとPRの2回走っていたため）。PRを開く前のブランチは、
# `gh workflow run ci.yml --ref <ブランチ>`で手動で流せる
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# 同じPRに新しいコミットを積んだら、古い実行を取り消す。mainへのpushは、コミットごとに最後まで流す
# （groupをコミットにするため、取り消し合わない）
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  # フロントエンドのチェック
  frontend:
    name: Frontend Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: '.node-version'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Markdown lint
        run: npm run lint:md

      - name: Unit tests
        run: npm test

  # バックエンドのチェック
  backend:
    name: Backend Check
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            libasound2-dev

      # rust-toolchain.tomlの版とコンポーネントを入れる
      - name: Setup Rust
        run: rustup toolchain install

      - name: Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri
          # mainでだけ保存し、PRはmainのキャッシュを使う（PRごとに保存すると、上限の10GBを超えて
          # mainのキャッシュが押し出されるため。ADR-125）
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Check format
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings

      - name: Run tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      # テスト実行時にbindings.tsが再生成されるため、
      # コミット済みの内容と差分がないこと（生成物が最新であること）を確認する
      - name: Check generated bindings are up to date
        run: |
          if ! git diff --exit-code -- src/lib/bindings.ts; then
            echo "::error::src/lib/bindings.ts が古くなっています。'cargo test --manifest-path src-tauri/Cargo.toml' を実行して再生成し、コミットしてください。"
            exit 1
          fi

  # macOSだけのコード（cfg(target_os = "macos")）とobjc2系の依存のチェック
  # fmtはOSによらずすべてのファイルを見るため、Backend Checkだけで行う
  backend-macos:
    name: Backend Check (macOS)
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # rust-toolchain.tomlの版とコンポーネントを入れる
      - name: Setup Rust
        run: rustup toolchain install

      - name: Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri
          # mainでだけ保存し、PRはmainのキャッシュを使う（PRごとに保存すると、上限の10GBを超えて
          # mainのキャッシュが押し出されるため。ADR-125）
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings

      - name: Run tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      # macOSで生成したbindings.tsも、コミット済みの内容と同じであることを確認する
      - name: Check generated bindings are up to date
        run: |
          if ! git diff --exit-code -- src/lib/bindings.ts; then
            echo "::error::src/lib/bindings.ts が古くなっています。'cargo test --manifest-path src-tauri/Cargo.toml' を実行して再生成し、コミットしてください。"
            exit 1
          fi

  # 曲の解析のSwiftのコード（swift/music_analysis.swift）と、それを呼ぶRustのコード
  # （cfg(music_understanding)）のチェック。MusicUnderstandingはmacOS 27のSDK（Xcode 27）に
  # しかないため、Backend Check (macOS)のランナー（Xcode 26）ではbuild.rsが組み込まない
  # Xcode 27のイメージはプレビューのため、このジョブは必須のチェックにしない（ADR-106）
  backend-macos-xcode27:
    name: Backend Check (macOS, Xcode 27)
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      # 手元と同じXcode 27.2を使う（イメージの既定は27.1で、macOSのSDKは27.0）
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Show Xcode version
        run: |
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-path

      # rust-toolchain.tomlの版とコンポーネントを入れる
      - name: Setup Rust
        run: rustup toolchain install

      - name: Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri
          # mainでだけ保存し、PRはmainのキャッシュを使う（PRごとに保存すると、上限の10GBを超えて
          # mainのキャッシュが押し出されるため。ADR-125）
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings

      - name: Run tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      # build.rsがSwiftのコードをビルドしてリンクしたこと（組み込めない時は、警告だけを出して
      # ビルドを続ける）を、テストの実行ファイルにSwiftの関数があることで確かめる
      - name: Check music analysis is built in
        run: |
          executable=$(cargo test --manifest-path src-tauri/Cargo.toml --lib --no-run --message-format=json \
            | jq -r 'select(.reason == "compiler-artifact" and .target.name == "muspice_lib" and .profile.test) | .executable')
          echo "Test executable: $executable"
          if ! nm "$executable" | grep '_muspice_music_analysis_'; then
            echo "::error::曲の解析のSwiftのコードが組み込まれていません。上のビルドのログのbuild.rsの警告（Music analysis is not built in）を確かめてください。"
            exit 1
          fi

      # MusicUnderstandingで実際に解析する（ランナーのmacOSは27のため、解析を使える）
      - name: Run music analysis tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib music_analysis -- --ignored --nocapture

      - name: Check generated bindings are up to date
        run: |
          if ! git diff --exit-code -- src/lib/bindings.ts; then
            echo "::error::src/lib/bindings.ts が古くなっています。'cargo test --manifest-path src-tauri/Cargo.toml' を実行して再生成し、コミットしてください。"
            exit 1
          fi

  # ビルドテスト（PRとmainへのpush）
  # mainでも走らせて、PRが使うビルド用のキャッシュをmainに作る（ADR-125）
  build:
    name: Build Test
    needs: [frontend, backend]
    strategy:
      fail-fast: false
      matrix:
        # 対応するOSはmacOSだけ（ADR-090）。Linuxは、ビルドが通ることだけを確かめる
        # （tauri.linux.conf.jsonで、配布物を.debだけにしている）。macOSの配布物のビルドは、
        # リリース用のワークフロー（#303）で行う
        platform: [ubuntu-latest]

    runs-on: ${{ matrix.platform }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install system dependencies (Linux)
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            libasound2-dev

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: '.node-version'
          cache: 'npm'

      # rust-toolchain.tomlの版とコンポーネントを入れる
      - name: Setup Rust
        run: rustup toolchain install

      - name: Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri
          # mainでだけ保存し、PRはmainのキャッシュを使う（PRごとに保存すると、上限の10GBを超えて
          # mainのキャッシュが押し出されるため。ADR-125）
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install frontend dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --verbose
