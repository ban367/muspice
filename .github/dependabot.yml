version: 2
updates:
  # npm依存関係の更新
  - package-ecosystem: 'npm'
    directory: '/'
    # 3つのエコシステムとも、毎週月曜の朝にそろえる
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
      timezone: 'Asia/Tokyo'
    open-pull-requests-limit: 5
    assignees:
      - 'ban367'
    labels:
      - 'dependencies'
      - 'npm'
    # minor/patchは1つのPRにまとめる（メジャー更新は個別PRで影響を確認する）
    groups:
      npm-minor-patch:
        update-types:
          - 'minor'
          - 'patch'
    ignore:
      # TypeScript 7は、svelte-check・typescript-eslint・@sveltejs/kitのpeerが`typescript` 6までのため見送る
      # （#152）。3つとも7に対応したら、この指定を外して上げる
      - dependency-name: 'typescript'
        versions:
          - '>=7.0.0'

  # Cargo依存関係の更新
  - package-ecosystem: 'cargo'
    directory: '/src-tauri'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
      timezone: 'Asia/Tokyo'
    open-pull-requests-limit: 5
    assignees:
      - 'ban367'
    labels:
      - 'dependencies'
      - 'rust'
    # minor/patchは1つのPRにまとめる
    # 注意: 0.x系クレートのminor更新（例: lofty 0.24→0.25）は破壊的変更を含みうるが、
    # semver上はminorとして同じグループに入る。CIが落ちた場合はグループから外して個別に対応する
    groups:
      cargo-minor-patch:
        update-types:
          - 'minor'
          - 'patch'

  # GitHub Actionsの更新
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
      timezone: 'Asia/Tokyo'
    open-pull-requests-limit: 3
    assignees:
      - 'ban367'
    labels:
      - 'dependencies'
      - 'ci'
    groups:
      github-actions:
        patterns:
          - '*'
