[package]
name = "muspice"
version = "0.1.0"
description = "デスクトップ音楽管理アプリケーション"
authors = ["ban367"]
license = "MIT"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "muspice_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
# メインウィンドウのサイズ・位置の記憶（Rust側だけで使い、WebViewには公開しない）
tauri-plugin-window-state = "2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# functions: 検索用の文字列の正規化を、SQLの関数としてトリガーから呼ぶ（search_text.rs）
rusqlite = { version = "0.40", features = ["bundled", "functions"] }
uuid = { version = "1.22", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
lofty = "0.25"
# 再生エンジン（playback/）: デコード。取り込める形式のコーデックとコンテナだけを有効にする
symphonia = { version = "0.6", default-features = false, features = [
    "opt-simd",
    "aac",
    "adpcm",
    "alac",
    "flac",
    "mpa",
    "pcm",
    "vorbis",
    "aiff",
    "isomp4",
    "ogg",
    "wav",
] }
# symphoniaにないOpusのデコーダー（libopusを同梱してビルドする。ビルドにCコンパイラとcmakeが要る）
symphonia-adapter-libopus = "0.3"
# 再生エンジン: 音声の出力（macOSはCoreAudio、LinuxはALSA）
cpal = "0.18"
# 再生エンジン: 出力デバイスのサンプルレートへの変換
rubato = "5"
# 再生エンジン: デコードのスレッドから出力のコールバックへ音声を渡すリングバッファ（ロックなし）
rtrb = "0.4"
# ライブラリフォルダの監視（変更の通知を短時間まとめる）
notify-debouncer-mini = "0.7"
# デバイスへの転送: 転送先の空き容量の取得
fs4 = { version = "1", default-features = false, features = ["sync"] }
# デバイスへの転送: デバイス上のファイル名をNFCにそろえる。検索: 全角・半角などをそろえる（NFKC）
unicode-normalization = "0.1"
# M3Uの読み込み: UTF-8以外（Shift_JIS・UTF-16）で書かれたファイルの文字コードの変換
encoding_rs = "0.8"
thiserror = "2"
# Tauriが内部で使うtokioと同じもの（セマフォのためsync機能のみ追加）
tokio = { version = "1", features = ["sync"] }
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
specta-typescript = "0.0.12"
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }

# OSのメディアキー・Now Playing（media_controls/macos.rs）。Tauriが使っているものと同じobjc2系で、
# MediaPlayerフレームワークを呼ぶ。使うクラスの機能だけを有効にする
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "NSData",
    "NSDictionary",
    "NSString",
    "NSValue",
] }
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "NSImage",
] }
objc2-core-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "CFCGTypes",
] }
objc2-media-player = { version = "0.3", default-features = false, features = [
    "std",
    "block2",
    "objc2-app-kit",
    "objc2-core-foundation",
    "MPMediaItem",
    "MPNowPlayingInfoCenter",
    "MPRemoteCommand",
    "MPRemoteCommandCenter",
    "MPRemoteCommandEvent",
] }
